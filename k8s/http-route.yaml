apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames: ["mos1ck.space"]
  rules:
    - matches:
        - path: { type: PathPrefix, value: /api }
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: meeting-service
          port: 80
    - backendRefs: # everything else - SPA
        - name: frontend
          port: 80