# Non-secret configuration of the deploy. Secrets live in secret.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: meeting-config
data:
  POSTGRES_DB: "meeting_db"
  POSTGRES_HOST: "postgres-service"
  POSTGRES_PORT: "5432"
  POSTGRES_SSL_MODE: "disable"
  HTTP_ADDR: ":8080"
  JWT_TTL: "30m"
  SLOT_HORIZON: "336h"
  SLOT_HORIZON_REPAIR_TZ: "Europe/Moscow"
  SLOT_HORIZON_REPAIR_TIME: "03:00"
  SLOT_HORIZON_FILLTAIL_INTERVAL: "1h"
  CONFERENCE_MOCK_FAILURE_RATE: "0.05"
  LOG_LEVEL: "info"
  SHUTDOWN_TIMEOUT: "10s"
