# vmagent — сборщик метрик.
# Через Kubernetes API находит таргеты (service discovery), раз в 15s
# забирает с них /metrics и отправляет в VictoriaMetrics single (remote write).
#
# Установка (после vm-single):
#   helm install vm-agent vm/victoria-metrics-agent -n monitoring -f k8s/victoria-metrics-agent-values.yaml
#
# Сервис получится: vm-agent-victoria-metrics-agent (порт 8429)

mode: deployment
replicaCount: 1

# по умолчанию у чарта сервис выключен — включаем для port-forward на 8429
service:
  enabled: true
  type: ClusterIP

remoteWrite:
  - url: http://vm-single-victoria-metrics-single-server.monitoring.svc:8428/api/v1/write

# RBAC (get/list/watch pods, nodes, endpoints, services) чарт создаёт сам
rbac:
  create: true

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

extraArgs:
  envflag.enable: true
  envflag.prefix: VM_
  loggerFormat: json
  # для /targets: показывать исходные метки таргетов, удобно при отладке relabeling
  promscrape.dropOriginalLabels: "false"

config:
  global:
    scrape_interval: 15s
    scrape_timeout: 10s
    # метка добавляется ко всем рядам: удобно, если кластеров станет несколько
    external_labels:
      cluster: meeting-k8s

  scrape_configs:
    # --- сам vmagent ---
    - job_name: vmagent
      static_configs:
        - targets: ["localhost:8429"]

    # --- VictoriaMetrics single (метрики самой базы) ---
    - job_name: victoriametrics
      static_configs:
        - targets: ["vm-single-victoria-metrics-single-server.monitoring.svc:8428"]

    # --- kube-apiserver ---
    - job_name: kubernetes-apiservers
      kubernetes_sd_configs:
        - role: endpoints
      scheme: https
      tls_config:
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        insecure_skip_verify: true
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      relabel_configs:
        - source_labels:
            [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
          action: keep
          regex: default;kubernetes;https

    # --- kubelet на каждой ноде ---
    - job_name: kubernetes-nodes
      kubernetes_sd_configs:
        - role: node
      scheme: https
      tls_config:
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        insecure_skip_verify: true
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      relabel_configs:
        - action: labelmap
          regex: __meta_kubernetes_node_label_(.+)

    # --- cAdvisor: CPU/память/сеть каждого контейнера ---
    - job_name: kubernetes-nodes-cadvisor
      kubernetes_sd_configs:
        - role: node
      scheme: https
      metrics_path: /metrics/cadvisor
      tls_config:
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        insecure_skip_verify: true
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      relabel_configs:
        - action: labelmap
          regex: __meta_kubernetes_node_label_(.+)

    # --- поды приложений по аннотациям prometheus.io/* ---
    # сюда попадают meeting (:9090/metrics) и postgres-exporter
    - job_name: kubernetes-pods
      kubernetes_sd_configs:
        - role: pod
      relabel_configs:
        # init-контейнеры не собираем
        - source_labels: [__meta_kubernetes_pod_container_init]
          action: drop
          regex: true
        # только поды с prometheus.io/scrape: "true"
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
          action: keep
          regex: "true"
        # SD даёт по таргету на каждый объявленный порт контейнера —
        # оставляем только порт из prometheus.io/port (без дублей на 8080/5432)
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port, __meta_kubernetes_pod_container_port_number]
          action: keep_if_equal
        # путь из prometheus.io/path (по умолчанию /metrics)
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
          action: replace
          target_label: __metrics_path__
          regex: (.+)
        # адрес = IP пода + prometheus.io/port
        - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
          action: replace
          regex: ([^:]+)(?::\d+)?;(\d+)
          replacement: $1:$2
          target_label: __address__
        # метки пода (app=meeting и т.п.) -> метки рядов
        - action: labelmap
          regex: __meta_kubernetes_pod_label_(.+)
        - source_labels: [__meta_kubernetes_namespace]
          target_label: namespace
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod
        - source_labels: [__meta_kubernetes_pod_container_name]
          target_label: container
        - source_labels: [__meta_kubernetes_pod_node_name]
          target_label: node
