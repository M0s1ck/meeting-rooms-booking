apiVersion: apps/v1
kind: Deployment
metadata:
  name: meeting
spec:
  replicas: 3
  selector:
    matchLabels:
      app: meeting
  template:
    metadata:
      labels:
        app: meeting
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: meeting-c
          image: mos1ck/meeting:v1.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: meeting-config
            - secretRef:
                name: meeting-secret
          readinessProbe:
            httpGet:
              path: /_info
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /_info
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
