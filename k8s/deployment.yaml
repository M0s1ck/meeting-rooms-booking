apiVersion: apps/v1
kind: Deployment
metadata:
  name: meeting
spec:
  replicas: 3
  selector:
    matchLabels:
      app: meeting
  template:
    metadata:
      labels:
        app: meeting
      # service discovery for vmagent (kubernetes_sd_configs, role: pod)
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: meeting-c
          image: mos1ck/meeting:1.4
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: meeting-config
            - secretRef:
                name: meeting-secret
          readinessProbe:
            httpGet:
              path: /_info
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /_info
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
