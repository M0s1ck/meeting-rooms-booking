# One-off admin process: runs DB migrations from the same release image and config as the app.
apiVersion: batch/v1
kind: Job
metadata:
  name: meeting-migrate-v1-0
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: meeting-migrator
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: mos1ck/meeting:1.1
          command: [ "sh", "./migrate.sh", "up" ]
          envFrom:
            - configMapRef:
                name: meeting-config
            - secretRef:
                name: meeting-secret
