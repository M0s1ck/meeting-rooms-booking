services:
  scheduler-postgres:
    image: postgres:17-alpine
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - scheduler-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  # one-off admin process: same image (release) as the app, runs migrations and exits
  scheduler-postgres-migrate:
    build:
      context: .
    env_file: .env
    command: [ "sh", "./migrate.sh", "up" ]
    depends_on:
      scheduler-postgres:
        condition: service_healthy

  meeting-scheduler:
    build:
      context: .
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      scheduler-postgres:
        condition: service_healthy
      scheduler-postgres-migrate:
        condition: service_completed_successfully

volumes:
  scheduler-postgres-data:
