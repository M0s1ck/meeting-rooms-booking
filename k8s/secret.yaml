# Example only: in a real deploy create it out of the repo, e.g.
#   kubectl create secret generic meeting-secret \
#     --from-literal=POSTGRES_USER=... --from-literal=POSTGRES_PASSWORD=... --from-literal=JWT_SECRET=...
apiVersion: v1
kind: Secret
metadata:
  name: meeting-secret
type: Opaque
stringData:
  POSTGRES_USER: "psg_user"
  POSTGRES_PASSWORD: "change-me"
  JWT_SECRET: "change-me"
